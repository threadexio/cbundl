# The `imports` array can be used to split the config to multiple files.
# Relative paths are resolved from the path of the module which included them.
#
# If two or more config files specify a value for the same option, an error
# is raised. To resolve this, all properties below can be overriden by setting
# them to `{ value = <desired value>, priority = -1 }`. After reading all
# config files from `imports`, the value with the least priority is kept.
# Properties where the value is not specified assume the default priority of
# 500. For all proprties which are lists (except `imports`) items can be added
# to the list either at the front or the back with:
# `{ value = [...], order = "before"|"after" }`.
#
# NOTE: Some properties do not follow these rules. Check the docs for each one.
imports = [
  "cbundl2.toml"
]

[bundle]
# Add separators between the contents of each source file inside the bundle.
separators = true

# Produce a deterministic bundle. This switch makes cbundl a pure function. This
# means that for the same source files, the same bundle is always produced. One
# sideffect is that dates will be displayed as the UNIX epoch and quotes will
# always be the same. This switch is useful if you intend to check into source
# control the bundle, where you wouldn't want to pollute diffs with changed to
# the generated date, or the quotes inside the bundle.
deterministic = true

# Write the final bundle to this path.
output = "test/frob/final.c"

##
## This section configures a custom header to be added to the very top of the
## bundle. Useful for adding license text or copyright notices.
##
[header]
# Whether to add the custom header.
enable = true

# The text to be added. Before you ask: yes, you can inject code from here
# but you shouldn't have to. If you find yourself doing that, you are doing
# something wrong.
#
# This property cannot be overriden. Multiple values are concatenated together
# with '\n'.
text = """
// My amazing header text!
"""

# Specify a file which contains the text for the header. The contents of the
# file will be pasted in verbatim. This means that the file must contain the
# text in C comments.
#source = "header.txt"

# NOTE: `text` and `source` cannot be specified both at the same time.

##
## This section configures the banner at the top of the bundle.
##
[banner]
# Whether to add the banner.
enable = true

##
## This section configures the quotes displayed inside the banner.
##
[banner.quote]
# Whether to add quotes inside the banner.
enable = true

# Pick quotes from this location. Specifying "all" here will allow cbundl to
# choose at random one quote without restrictions. "builtin" will only pick
# quotes that are built-in to cbundl. "custom" will only pick quotes that are
# configured here.
#
# Valid values: "all", "builtin", "custom"
pick = "custom"

##
## This section configures how cbundl will format the bundle.
##
[formatter]
# Whether to format the bundle.
enable = true

# Path to the formatter binary. Specifying just the executable will make cbundl
# search in PATH for it.
path = "clang-format"

# Extra arguments to pass to the formatter.
args = ["--sort-includes"]


# A custom quote.
[[quote]]
# Quote text. Will appear as is.
text = """
Use a gun. And if that don't work...
                                      use more gun.
"""
# Quote author. Make sure to give proper credit.
author = "Dr. Dell Conagher"

[[quote]]
text = "Democracy prevails once more."
author = "Democracy Officer"
